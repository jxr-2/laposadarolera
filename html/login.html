<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · La Posada Rolera</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <header class="topbar">
        <a class="brand-mark" href="../index.html" aria-label="Ir al inicio">
            <img src="../assets/images/logo-lpr.png" alt="La Posada Rolera">
            <span>LA POSADA<br><strong>ROLERA</strong></span>
        </a>
        <nav aria-label="Navegación principal">
            <a href="mesas_subidas.html" data-require-auth>Mesas</a>
            <a href="../index.html#como-funciona">¿Cómo funciona?</a>
            <!--a href="archivo.html" data-require-auth>Archivo</a-->
            <a href="admin.html" data-require-admin>Panel admin</a>
            <div id="nav-auth"></div>
        </nav>
    </header>

    <main class="page">
        <div class="form-card">
            <div class="tabs" role="tablist">
                <button type="button" class="is-active" id="tab-ingresar">Ingresar</button>
                <button type="button" id="tab-crear">Crear cuenta</button>
            </div>

            <div id="panel-ingresar">
                <p id="error-ingresar" class="form-error" hidden></p>
                <form id="form-ingresar">
                    <div class="field">
                        <label for="li-email">Email</label>
                        <input type="email" id="li-email" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="li-pass">Contraseña</label>
                        <input type="password" id="li-pass" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary btn-block">Ingresar</button>
                </form>
                <p class="form-hint" style="margin-top:18px;">Demo admin: admin@posadarolera.com / admin123 · Demo jugadora: demo@posadarolera.com / demo123</p>
            </div>

            <div id="panel-crear" hidden>
                <p id="error-crear" class="form-error" hidden></p>
                <form id="form-crear">
                    <div class="field-row">
                        <div class="field">
                            <label for="cr-nombre">Nombre y apellido</label>
                            <input type="text" id="cr-nombre" required>
                        </div>
                        <div class="field">
                            <label for="cr-apodo">Apodo (opcional)</label>
                            <input type="text" id="cr-apodo">
                        </div>
                    </div>
                    <div class="field">
                        <label for="cr-email">Email</label>
                        <input type="email" id="cr-email" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="cr-telefono">Teléfono de contacto</label>
                        <input type="tel" id="cr-telefono" placeholder="Para que te reconfirmen inscripciones">
                    </div>
                    <div class="field">
                        <label for="cr-pass">Contraseña</label>
                        <input type="password" id="cr-pass" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary btn-block">Crear cuenta</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>La Posada Rolera</p>
        <span>El punto de encuentro de la comunidad rolera de Puerto Madryn. · <a href="https://instagram.com/laposadarolera" target="_blank" rel="noopener">@laposadarolera</a></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/mesas-data.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
